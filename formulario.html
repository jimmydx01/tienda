<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subir producto | CarpiShop</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./css/formulario.css" />
  </head>
  <body class="upload-page">
    <div class="upload-shell">
      <header class="upload-header">
        <a class="upload-brand" href="./index.html">CarpiShop</a>
        <a class="upload-back" href="./index.html"
          ><i class="bi bi-arrow-left"></i> Volver a la tienda</a
        >
      </header>
      <main class="upload-main">
        <p class="upload-eyebrow">CATÁLOGO</p>
        <h1 class="upload-title">Subir producto</h1>
        <form
          class="upload-form"
          action="guardar_producto.php"
          method="post"
          enctype="multipart/form-data"
        >
          <div class="upload-field">
            <label for="titulo">Nombre del producto</label>
            <input
              type="text"
              id="titulo"
              name="titulo"
              placeholder="Ej. Abrigo clásico"
              required
            />
          </div>
          <div class="upload-field">
            <label for="precio">Precio</label>
            <div class="upload-price">
              <span>$</span>
              <input
                type="number"
                id="precio"
                name="precio"
                min="0"
                step="0.01"
                placeholder="0.00"
                required
              />
            </div>
          </div>
          <div class="upload-field upload-field-full">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
              <option value="" disabled selected>
                Selecciona una categoría
              </option>
              <option value="Ropa">Ropa</option>
              <option value="Tegnologuia">Tecnología</option>
              <option value="Vehiculos">Vehículos</option>
            </select>
          </div>
          <div class="upload-field upload-field-full">
            <span class="upload-label">Imagen del producto</span>
            <label class="upload-file" for="imagen">
              <i class="bi bi-cloud-arrow-up"></i>
              <span
                ><strong>Seleccionar imagen</strong
                ><small>JPG o PNG</small></span
              >
              <input
                type="file"
                id="imagen"
                name="imagen"
                accept=".jpg, .jpeg, .png"
                required
              />
            </label>
          </div>
          <button type="submit" class="upload-submit">
            <i class="bi bi-plus-lg"></i> Publicar producto
          </button>
        </form>
      </main>
      <footer class="upload-footer">© 2026 CarpiShop</footer>
    </div>
  </body>
</html>
